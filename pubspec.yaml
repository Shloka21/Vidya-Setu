name: vidyasetu
description: "Smart Student Reminder & Mentor Guidance App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # State Management
  provider: ^6.1.2

  # Auth
  google_sign_in: ^6.2.2

  # Local Storage
  shared_preferences: ^2.3.4

  # UI / Design
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # Charts
  fl_chart: ^0.70.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  http: ^1.2.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  syncfusion_flutter_pdf: ^24.1.41

  # Notifications
  flutter_local_notifications: ^18.0.1
  flutter_tts: ^4.2.0

  # Video Calls
  jitsi_meet_flutter_sdk: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#1B2838"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
